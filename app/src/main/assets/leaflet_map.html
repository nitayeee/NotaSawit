<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        body { padding: 0; margin: 0; }
        html, body, #map { height: 100vh; width: 100vw; }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // Inisialisasi peta
        var map = L.map('map').setView([0.5, 101.5], 13);
        
        // Menggunakan OpenStreetMap standar karena di browser ini tidak akan diblokir
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var featureGroup = new L.FeatureGroup();
        map.addLayer(featureGroup);

        // Fungsi ini akan dipanggil dari Android Kotlin
        function renderPolygons(jsonArray) {
            featureGroup.clearLayers();
            
            try {
                jsonArray.forEach(function(geoJsonObj) {
                    
                    var polygon = L.geoJSON(geoJsonObj, {
                        style: function (feature) {
                            return {
                                color: "#10B981",
                                weight: 3,
                                fillColor: "#10B981",
                                fillOpacity: 0.4
                            };
                        }
                    });
                    
                    featureGroup.addLayer(polygon);
                });
                
                if (featureGroup.getLayers().length > 0) {
                    // Zoom fokus ke lahan pertama saja (indeks 0)
                    var firstLand = featureGroup.getLayers()[0];
                    map.fitBounds(firstLand.getBounds(), {padding: [30, 30], maxZoom: 17});
                }
            } catch (e) {
                console.error("Error parsing GeoJSON: ", e);
            }
        }
    </script>
</body>
</html>
