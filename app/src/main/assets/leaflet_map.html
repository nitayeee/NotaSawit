<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        body { padding: 0; margin: 0; }
        html, body, #map { height: 100vh; width: 100vw; }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        });

        var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri'
        });

        // Inisialisasi peta dengan layer OSM sebagai default
        var map = L.map('map', {
            center: [0.5, 101.5],
            zoom: 13,
            layers: [osm]
        });

        // Tambahkan kontrol layer di pojok kanan atas
        var baseMaps = {
            "OSM Standar": osm,
            "Satelit": satellite
        };
        L.control.layers(baseMaps).addTo(map);

        var featureGroup = new L.FeatureGroup();
        map.addLayer(featureGroup);

        // Fungsi ini akan dipanggil dari Android Kotlin
        function renderPolygons(jsonArray) {
            featureGroup.clearLayers();
            
            try {
                jsonArray.forEach(function(geoJsonObj) {
                    
                    var polygon = L.geoJSON(geoJsonObj, {
                        style: function (feature) {
                            return {
                                color: "#10B981",
                                weight: 3,
                                fillColor: "#10B981",
                                fillOpacity: 0.4
                            };
                        }
                    });

                    // Tambahkan event click untuk membuka Maps
                    polygon.on('click', function(e) {
                        var bounds = e.sourceTarget.getBounds();
                        var center = bounds.getCenter();
                        var lahanNama = "Lahan";
                        if (geoJsonObj.properties && geoJsonObj.properties.lahan_nama) {
                            lahanNama = geoJsonObj.properties.lahan_nama;
                        }
                        
                        // Panggil interface Android
                        if (typeof Android !== "undefined") {
                            Android.openGoogleMaps(center.lat, center.lng, lahanNama);
                        }
                    });
                    
                    featureGroup.addLayer(polygon);
                });
                
                if (featureGroup.getLayers().length > 0) {
                    // Zoom fokus ke semua lahan yang ditampilkan
                    var bounds = featureGroup.getBounds();
                    map.fitBounds(bounds, {padding: [30, 30], maxZoom: 17});
                }
            } catch (e) {
                console.error("Error parsing GeoJSON: ", e);
            }
        }
    </script>
</body>
</html>
