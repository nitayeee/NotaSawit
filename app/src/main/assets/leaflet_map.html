<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        body { padding: 0; margin: 0; }
        html, body, #map { height: 100vh; width: 100vw; }

        .live-location-marker {
            width: 16px;
            height: 16px;
            background-color: #1a73e8;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(26, 115, 232, 0.9);
            position: relative;
        }
        .live-location-marker::after {
            content: '';
            position: absolute;
            top: -6px; left: -6px; right: -6px; bottom: -6px;
            border-radius: 50%;
            background-color: rgba(26, 115, 232, 0.35);
            animation: live-pulse-ring 2s infinite ease-out;
        }
        @keyframes live-pulse-ring {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2.3); opacity: 0; }
        }

        .leaflet-control-locate-btn {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease-in-out;
        }
        .leaflet-control-locate-btn:hover {
            background: #f8fafc;
            transform: scale(1.08);
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        });

        var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri'
        });

        // Inisialisasi peta dengan layer OSM sebagai default
        var map = L.map('map', {
            center: [0.5, 101.5],
            zoom: 13,
            layers: [osm]
        });

        // Tambahkan kontrol layer di pojok kanan atas
        var baseMaps = {
            "OSM Standar": osm,
            "Satelit": satellite
        };
        L.control.layers(baseMaps).addTo(map);

        // -------------------------------------------------------------
        // LIVE LOCATION TRACKING ON-DEMAND (HANYA SAAT TOMBOL DIKLIK)
        // -------------------------------------------------------------
        let userMarker = null;
        let accuracyCircle = null;
        let watchId = null;

        const pulseIcon = L.divIcon({
            className: 'custom-live-pin',
            html: '<div class="live-location-marker"></div>',
            iconSize: [20, 20],
            iconAnchor: [10, 10]
        });

        // Tombol Melayang "Lokasi Saya" di Peta (Pojok Kanan Atas)
        const locateControl = L.control({ position: 'topright' });
        locateControl.onAdd = function () {
            const btn = L.DomUtil.create('div', 'leaflet-control-locate-btn');
            btn.title = "Lihat Lokasi Saya (GPS)";
            btn.innerHTML = `<svg style="width:22px;height:22px;color:#1a73e8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"></path>
            </svg>`;

            L.DomEvent.disableClickPropagation(btn);
            btn.onclick = function () {
                if (!("geolocation" in navigator)) {
                    alert("GPS tidak didukung pada browser/perangkat ini.");
                    return;
                }

                btn.style.opacity = "0.5";

                navigator.geolocation.getCurrentPosition(
                    function (pos) {
                        btn.style.opacity = "1";
                        const lat = pos.coords.latitude;
                        const lng = pos.coords.longitude;
                        const accuracy = pos.coords.accuracy;
                        const userPos = [lat, lng];

                        if (!userMarker) {
                            userMarker = L.marker(userPos, { icon: pulseIcon }).addTo(map);
                            userMarker.bindPopup(`
                                <div style="font-family: sans-serif; font-size: 12px; min-width: 130px;">
                                    <strong style="color: #1a73e8; font-size: 13px;">Lokasi Admin (Live)</strong><br>
                                    <hr style="margin: 4px 0; border: 0; border-top: 1px solid #eee;">
                                    Akurasi GPS: &plusmn;` + Math.round(accuracy) + ` m
                                </div>
                            `);

                            accuracyCircle = L.circle(userPos, {
                                radius: accuracy,
                                color: '#1a73e8',
                                fillColor: '#2563eb',
                                fillOpacity: 0.12,
                                weight: 1.5,
                                dashArray: '4, 4'
                            }).addTo(map);
                        } else {
                            userMarker.setLatLng(userPos);
                            accuracyCircle.setLatLng(userPos);
                            accuracyCircle.setRadius(accuracy);
                        }

                        map.flyTo(userPos, 16, { animate: true, duration: 1.2 });
                        userMarker.openPopup();

                        if (!watchId) {
                            watchId = navigator.geolocation.watchPosition(function (wPos) {
                                const wLat = wPos.coords.latitude;
                                const wLng = wPos.coords.longitude;
                                const wAcc = wPos.coords.accuracy;
                                const wPosArr = [wLat, wLng];
                                if (userMarker) {
                                    userMarker.setLatLng(wPosArr);
                                    accuracyCircle.setLatLng(wPosArr);
                                    accuracyCircle.setRadius(wAcc);
                                }
                            }, null, { enableHighAccuracy: true, maximumAge: 3000 });
                        }
                    },
                    function (err) {
                        btn.style.opacity = "1";
                        alert("Gagal mengambil lokasi GPS: Silakan izinkan akses lokasi pada HP.");
                    },
                    { enableHighAccuracy: true, timeout: 15000 }
                );
            };
            return btn;
        };
        locateControl.addTo(map);

        var featureGroup = new L.FeatureGroup();
        map.addLayer(featureGroup);

        // Fungsi ini akan dipanggil dari Android Kotlin
        function renderPolygons(jsonArray) {
            featureGroup.clearLayers();
            
            try {
                jsonArray.forEach(function(geoJsonObj) {
                    
                    var polygon = L.geoJSON(geoJsonObj, {
                        style: function (feature) {
                            return {
                                color: "#FACC15",
                                weight: 3,
                                fillColor: "#10B981",
                                fillOpacity: 0.45
                            };
                        }
                    });

                    var lahanNama = "Lahan";
                    var petaniNama = "-";
                    if (geoJsonObj.properties) {
                        if (geoJsonObj.properties.lahan_nama) lahanNama = geoJsonObj.properties.lahan_nama;
                        if (geoJsonObj.properties.petani_nama) petaniNama = geoJsonObj.properties.petani_nama;
                    }

                    polygon.bindPopup("<div style='font-family:sans-serif; padding:4px;'><b>" + lahanNama + "</b><br/>Petani: " + petaniNama + "</div>");

                    // Tambahkan event click untuk membuka Maps
                    polygon.on('click', function(e) {
                        var bounds = e.sourceTarget.getBounds();
                        var center = bounds.getCenter();
                        
                        // Panggil interface Android
                        if (typeof Android !== "undefined") {
                            Android.openGoogleMaps(center.lat, center.lng, lahanNama);
                        }
                    });
                    
                    featureGroup.addLayer(polygon);
                });
                
                if (featureGroup.getLayers().length > 0) {
                    // Zoom fokus ke semua lahan yang ditampilkan (Default)
                    var bounds = featureGroup.getBounds();
                    map.fitBounds(bounds, {padding: [30, 30], maxZoom: 17});
                }
            } catch (e) {
                console.error("Error parsing GeoJSON: ", e);
            }
        }
    </script>
</body>
</html>
